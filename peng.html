<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <!-- 手機與 Android 觸控螢幕設定 -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"
  >

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#007f7d">

  <title>彭宇俊 課表</title>

  <style>
    /* ==============================
       全域設定
    ============================== */

    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding:
        max(10px, env(safe-area-inset-top))
        max(10px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));

      color: #00158c;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;

      background:
        linear-gradient(
          rgba(248, 242, 229, 0.93),
          rgba(248, 242, 229, 0.93)
        ),
        repeating-linear-gradient(
          135deg,
          #e6dfcb 0,
          #e6dfcb 4px,
          #f3eedf 4px,
          #f3eedf 12px
        );

      overscroll-behavior: contain;
      touch-action: manipulation;
    }

    button,
    a {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    /* ==============================
       頁面容器
    ============================== */

    .page {
      width: 100%;
      max-width: 1600px;
      min-height: calc(100vh - 20px);
      min-height: calc(100dvh - 20px);
      margin: 0 auto;

      display: flex;
      flex-direction: column;
    }

    /* ==============================
       頂部標題列
    ============================== */

    .topbar {
      flex: 0 0 auto;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;

      margin-bottom: 8px;
      padding: 2px 4px;
    }

    .title {
      flex: 1;
      margin: 0;

      color: #f01818;
      text-align: center;
      font-size: clamp(24px, 3vw, 42px);
      font-weight: 500;
      line-height: 1.2;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

<!DOCTYPE html>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 14px;
      background:
        linear-gradient(
          rgba(248, 242, 229, 0.92),
          rgba(248, 242, 229, 0.92)
        ),
        repeating-linear-gradient(
          135deg,
          #e6dfcb 0,
          #e6dfcb 4px,
          #f3eedf 4px,
          #f3eedf 12px
        );

      color: #00158c;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;
    }

    .page {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* 頂部標題 */
    .top-title {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
      margin-bottom: 6px;
      text-align: center;
      flex-wrap: wrap;
    }

    .title {
      margin: 0;
      color: #f01818;
      font-size: clamp(22px, 3.5vw, 34px);
      font-weight: 500;
    }

    .back-top {
      color: #47720c;
      font-size: clamp(20px, 3vw, 30px);
      text-decoration: underline;
      white-space: nowrap;
    }

    .back-top:hover {
      color: #6b991a;
    }

    /* 課表 */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #001d91;
      background: rgba(255, 255, 255, 0.22);
    }

    table {
      width: 100%;
      min-width: 720px;
      border-collapse: separate;
      border-spacing: 3px;
      table-layout: fixed;
      background: rgba(245, 238, 222, 0.55);
    }

    th,
    td {
      border: 2px solid #002299;
      text-align: center;
      vertical-align: middle;
    }

    thead th {
      height: 58px;
      padding: 5px;
      background: #078b88;
      color: #ffffff;
      font-size: clamp(20px, 3vw, 30px);
      font-weight: 700;
      white-space: nowrap;
    }

    thead th:first-child {
      width: 95px;
    }

    tbody tr {
      height: 92px;
    }

    tbody td {
      padding: 5px 3px;
      background: rgba(248, 240, 226, 0.72);
    }

    /* 圖片中的黃色課堂列 */
    tbody tr.yellow-row td:not(.period) {
      background: #ffff00;
    }

    /* 左邊節次 */
    td.period {
      width: 95px;
      padding: 4px;
      background: #00f02b;
      color: #0016a0;
      font-size: clamp(20px, 2.8vw, 28px);
      font-weight: 700;
      white-space: nowrap;
    }

    /* 課程名稱 */
    .subject {
      display: block;
      color: #001595;
      font-size: clamp(22px, 3vw, 31px);
      line-height: 1.15;
      white-space: nowrap;
    }

    /* 教室 */
    .room {
      display: block;
      margin-top: 5px;
      color: #577f2d;
      font-size: clamp(19px, 2.6vw, 27px);
      line-height: 1.1;
      text-decoration: underline;
      white-space: nowrap;
    }

    /* 空白格 */
    .empty {
      color: transparent;
    }

    /* 手機顯示 */
    @media (max-width: 760px) {
      body {
        padding: 6px;
      }

      .top-title {
        gap: 12px;
      }

      table {
        min-width: 680px;
      }

      thead th:first-child,
      td.period {
        width: 90px;
      }

      tbody tr {
        height: 85px;
      }
    }
  </style>
</head>
