<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#078b88">
  <title>彭宇俊 課表</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding:
        max(6px, env(safe-area-inset-top))
        max(6px, env(safe-area-inset-right))
        max(6px, env(safe-area-inset-bottom))
        max(6px, env(safe-area-inset-left));
      color: #00158c;
      font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
      background:
        linear-gradient(rgba(248,242,229,.93), rgba(248,242,229,.93)),
        repeating-linear-gradient(135deg, #e6dfcb 0, #e6dfcb 4px, #f3eedf 4px, #f3eedf 12px);
      overscroll-behavior: contain;
    }

    .page {
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .title {
      flex: 1;
      margin: 0;
      color: #f01818;
      text-align: center;
      font-size: clamp(22px, 4vw, 40px);
      font-weight: 700;
      line-height: 1.2;
    }

    .fullscreen-button {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 7px 12px;
      border: 1px solid #47720c;
      border-radius: 8px;
      background: #f4ffe7;
      color: #47720c;
      font: inherit;
      font-size: clamp(14px, 2vw, 20px);
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .table-wrapper {
      width: 100%;
      overflow: hidden;
      border: 1px solid #001d91;
      background: rgba(255,255,255,.22);
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: clamp(1px, .25vw, 3px);
      table-layout: fixed;
      background: rgba(245,238,222,.55);
    }

    th,
    td {
      min-width: 0;
      border: clamp(1px, .2vw, 2px) solid #002299;
      text-align: center;
      vertical-align: middle;
      overflow: hidden;
    }

    thead th {
      height: clamp(42px, 7vh, 68px);
      padding: 4px 2px;
      background: #078b88;
      color: #fff;
      font-size: clamp(13px, 2.5vw, 30px);
      font-weight: 700;
      line-height: 1.1;
      white-space: nowrap;
    }

    thead th:first-child {
      width: clamp(48px, 11vw, 105px);
    }

    tbody tr {
      height: clamp(58px, 10.8vh, 105px);
    }

    tbody td {
      padding: 3px 2px;
      background: rgba(248,240,226,.78);
    }

    tbody tr.yellow-row td:not(.period) {
      background: #ffff00;
    }

    td.period {
      width: clamp(48px, 11vw, 105px);
      padding: 2px;
      background: #00ed2c;
      color: #0016a0;
      font-size: clamp(12px, 2.4vw, 28px);
      font-weight: 700;
      line-height: 1.08;
      white-space: nowrap;
    }

    .subject,
    .room {
      display: block;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .subject {
      color: #001595;
      font-size: clamp(12px, 2.35vw, 31px);
      font-weight: 500;
      line-height: 1.12;
    }

    .room {
      margin-top: 3px;
      color: #577f2d;
      font-size: clamp(11px, 2vw, 27px);
      line-height: 1.05;
      text-decoration: underline;
    }

    .empty {
      color: transparent;
    }

    @media (max-width: 600px) {
      body {
        padding:
          max(3px, env(safe-area-inset-top))
          max(3px, env(safe-area-inset-right))
          max(3px, env(safe-area-inset-bottom))
          max(3px, env(safe-area-inset-left));
      }

      .topbar {
        gap: 5px;
        margin-bottom: 4px;
      }

      .title {
        font-size: clamp(19px, 6vw, 27px);
      }

      .fullscreen-button {
        min-height: 36px;
        padding: 5px 8px;
        font-size: 13px;
      }

      thead th:first-child,
      td.period {
        width: 15%;
      }

      tbody tr {
        height: clamp(54px, 11.5vh, 82px);
      }

      .subject {
        font-size: clamp(11px, 3.6vw, 18px);
      }

      .room {
        font-size: clamp(10px, 3.1vw, 16px);
      }
    }

    @media (max-width: 390px) {
      .fullscreen-button {
        padding: 4px 6px;
      }

      thead th {
        font-size: 12px;
      }

      td.period {
        font-size: 11px;
      }

      .subject {
        font-size: 11px;
      }

      .room {
        font-size: 10px;
      }
    }

    @media (orientation: landscape) and (max-height: 650px) {
      .topbar {
        margin-bottom: 3px;
      }

      .title {
        font-size: clamp(19px, 3vw, 27px);
      }

      .fullscreen-button {
        min-height: 34px;
        padding: 4px 8px;
      }

      thead th {
        height: 34px;
      }

      tbody tr {
        height: calc((100dvh - 90px) / 7);
      }
    }

    @media print {
      body {
        padding: 0;
        background: #fff;
      }

      .fullscreen-button {
        display: none;
      }

      .page {
        max-width: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="topbar">
      <h1 class="title">彭宇俊 課表</h1>
      <button type="button" class="fullscreen-button" id="fullscreenButton">全螢幕</button>
    </header>

    <div class="table-wrapper">
      <table aria-label="彭宇俊課表">
        <thead>
          <tr>
            <th aria-label="節次"></th>
            <th scope="col">星期一</th>
            <th scope="col">星期二</th>
            <th scope="col">星期三</th>
            <th scope="col">星期四</th>
            <th scope="col">星期五</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td class="period">第1節</td>
            <td><span class="subject">林中講堂</span><span class="room">805</span></td>
            <td><span class="subject">自然</span><span class="room">922</span></td>
            <td><span class="subject">自然</span><span class="room">805</span></td>
            <td class="empty">&nbsp;</td>
            <td class="empty">&nbsp;</td>
          </tr>

          <tr class="yellow-row">
            <td class="period">第2節</td>
            <td class="empty">&nbsp;</td>
            <td class="empty">&nbsp;</td>
            <td><span class="subject">自然</span><span class="room">922</span></td>
            <td class="empty">&nbsp;</td>
            <td class="empty">&nbsp;</td>
          </tr>

          <tr>
            <td class="period">第3節</td>
            <td><span class="subject">自然</span><span class="room">805</span></td>
            <td class="empty">&nbsp;</td>
            <td class="empty">&nbsp;</td>
            <td class="empty">&nbsp;</td>
            <td class="empty">&nbsp;</td>
          </tr>

          <tr class="yellow-row">
            <td class="period">第4節</td>
            <td class="empty">&nbsp;</td>
            <td class="empty">&nbsp;</td>
            <td class="empty">&nbsp;</td>
            <td class="empty">&nbsp;</td>
            <td><span class="subject">自然</span><span class="room">922</span></td>
          </tr>

          <tr>
            <td class="period">第5節</td>
            <td><span class="subject">自然</span><span class="room">816</span></td>
            <td class="empty">&nbsp;</td>
            <td><span class="subject">自然</span><span class="room">922</span></td>
            <td><span class="subject">自然</span><span class="room">806</span></td>
            <td class="empty">&nbsp;</td>
          </tr>

          <tr class="yellow-row">
            <td class="period">第6節</td>
            <td><span class="subject">自然</span><span class="room">806</span></td>
            <td class="empty">&nbsp;</td>
            <td><span class="subject">自然</span><span class="room">816</span></td>
            <td><span class="subject">自然</span><span class="room">805</span></td>
            <td><span class="subject">自然</span><span class="room">806</span></td>
          </tr>

          <tr>
            <td class="period">第7節</td>
            <td class="empty">&nbsp;</td>
            <td class="empty">&nbsp;</td>
            <td class="empty">&nbsp;</td>
            <td><span class="subject">自然</span><span class="room">816</span></td>
            <td class="empty">&nbsp;</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    const fullscreenButton = document.getElementById("fullscreenButton");

    fullscreenButton.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (error) {
        console.warn("此瀏覽器無法切換全螢幕模式。", error);
      }
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenButton.textContent = document.fullscreenElement
        ? "離開全螢幕"
        : "全螢幕";
    });
  </script>
</body>
</html>
